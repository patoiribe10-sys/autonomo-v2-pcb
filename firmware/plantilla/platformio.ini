; Plantilla para programas nuevos de la PCB Autonomo_V2.
; Copia toda la carpeta "plantilla", cambiale el nombre y agrega la carpeta
; al workspace (RoboUAQ-firmware.code-workspace).
[env:esp32doit-devkit-v1]
platform = espressif32@^8.0.0
board = esp32doit-devkit-v1
framework = arduino
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
    adafruit/Adafruit NeoPixel@^1.12.3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800
