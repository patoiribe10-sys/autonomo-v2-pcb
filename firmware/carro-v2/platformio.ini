; Firmware del carro (PCB Autonomo_V2): recibe V<vel>,S<dir> de la Jetson
; por USB (Serial) o por UART2 (J4) y manda telemetria a ~20 Hz.
;
; Laptop (Windows, boton Upload de VS Code): entorno esp32doit-devkit-v1, detecta el puerto solo.
; Jetson: pio run -e jetson -t upload   y   pio device monitor -e jetson
[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32@^8.0.0
board = esp32doit-devkit-v1
framework = arduino
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
build_flags = -Wall
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800

; Igual que el de arriba pero con el puerto fijo de la Jetson (regla udev 99-esp32.rules)
[env:jetson]
extends = env:esp32doit-devkit-v1
upload_port = /dev/esp32
monitor_port = /dev/esp32
