; Prueba del USB (CH340) y de los botones/LED de la PCB Autonomo_V2.
; Solo necesita el cable USB-C. No usa bateria.
[env:esp32doit-devkit-v1]
platform = espressif32@^8.0.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800
