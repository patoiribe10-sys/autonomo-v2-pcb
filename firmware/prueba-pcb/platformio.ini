; Firmware de prueba de la PCB Autonomo_V2 (RoboUAQ 2026)
; Abre la carpeta con PlatformIO, sube y abre el monitor serial a 115200.
[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
    adafruit/Adafruit NeoPixel@^1.12.3
monitor_speed = 115200
upload_speed = 921600
