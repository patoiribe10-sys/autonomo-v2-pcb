; Demo de recorrido: START arranca la secuencia, BOOT la detiene.
; Necesita bateria (motor y servo) y el puente de paro en J10 pines 3-4.
[env:esp32doit-devkit-v1]
platform = espressif32@^8.0.0
board = esp32doit-devkit-v1
framework = arduino
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800
